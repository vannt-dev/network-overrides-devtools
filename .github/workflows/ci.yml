name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check .

      - name: Lint TypeScript code
        run: npm run lint

      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx commitlint --from "origin/$BASE_REF" --to HEAD
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            npx commitlint --from "$BEFORE" --to "$SHA"
          else
            # Force-push or new branch: the "before" SHA no longer exists; lint just the head commit.
            npx commitlint --last
          fi

  unit-test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run ci:test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

  store-package:
    name: Store Package Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Store ZIP
        run: npm run package:store

      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        id: zip
        run: echo "path=$(ls release/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        uses: vannt-dev/mv3-remote-code-check@f066757b2c013f4bac44be401727e6742bf4ce64 # v0.6.0
        with:
          path: ${{ steps.zip.outputs.path }}

  smoke-test:
    name: Playwright Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium dependencies
        # On a GitHub runner --with-deps only adds font packages. When the runner cannot reach
        # the Ubuntu mirrors, install the browser alone: the smoke test below still decides.
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Run Playwright smoke test
        run: xvfb-run --auto-servernum npm run smoke

  # The one check branch protection requires: it passes when every job above passed or was
  # skipped, and fails on a failure or a cancellation.
  ci-result:
    name: CI result
    if: always()
    needs: [lint, unit-test, store-package, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
