name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache in the job that builds the release: a poisoned cache would ship.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$VERSION" >> "$GITHUB_ENV"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build store release package
        if: steps.check_tag.outputs.EXISTS != 'true'
        run: npm run package:store

      # Reads the ZIP the way the Chrome Web Store review does: no remotely hosted code (MV3).
      - name: Find the Store ZIP
        if: steps.check_tag.outputs.EXISTS != 'true'
        id: zip
        run: echo "path=$(ls release/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Check the Store ZIP for remotely hosted code
        if: steps.check_tag.outputs.EXISTS != 'true'
        uses: vannt-dev/mv3-remote-code-check@9e84b492001753fcc2c640c4b7b8ff4445bf0866 # v0.5.0
        with:
          path: ${{ steps.zip.outputs.path }}

      - name: Attest store package
        if: steps.check_tag.outputs.EXISTS != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Network Overrides DevTools ${{ env.TAG_NAME }}
          body: |
            ## Network Overrides API (DevTools) ${{ env.TAG_NAME }}

            ### 🚀 Automatic Build & Store Package
            - **Zip Package**: `network-overrides-api-devtools-${{ env.TAG_NAME }}-store.zip`
            - **Chrome Web Store**: [Link](https://chromewebstore.google.com/detail/network-overrides-api-dev/holdjgmcnpelgclhopiejilhhkfcmpba)
            - **Verify**: `gh attestation verify network-overrides-api-devtools-${{ env.TAG_NAME }}-store.zip --owner vannt-dev`

            *Refer to `README.md` and `USE.md` for installation and usage instructions.*
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: >-
          steps.check_tag.outputs.EXISTS != 'true' &&
          env.CWS_CLIENT_ID != '' &&
          env.CWS_CLIENT_SECRET != '' &&
          env.CWS_REFRESH_TOKEN != ''
        uses: browser-actions/release-chrome-extension@bde2f9ad09b20a52d4e71eca4a9daf99d412a8d9 # v0.2.1
        with:
          extension-id: 'holdjgmcnpelgclhopiejilhhkfcmpba'
          extension-path: release/network-overrides-api-devtools-${{ env.TAG_NAME }}-store.zip
          oauth-client-id: ${{ env.CWS_CLIENT_ID }}
          oauth-client-secret: ${{ env.CWS_CLIENT_SECRET }}
          oauth-refresh-token: ${{ env.CWS_REFRESH_TOKEN }}
