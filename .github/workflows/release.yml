name: Automated Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Build store release package
        if: steps.check_tag.outputs.EXISTS != 'true'
        run: npm run package:store

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Network Overrides DevTools ${{ env.TAG_NAME }}
          body: |
            ## Network Overrides API (DevTools) ${{ env.TAG_NAME }}

            ### 🚀 Automatic Build & Store Package
            - **Zip Package**: `network-overrides-api-devtools-${{ env.TAG_NAME }}-store.zip`
            - **Chrome Web Store**: [Link](https://chromewebstore.google.com/detail/network-overrides-api-dev/holdjgmcnpelgclhopiejilhhkfcmpba)

            *Refer to `README.md` and `USE.md` for installation and usage instructions.*
          files: release/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload & Publish to Chrome Web Store
        if: >-
          steps.check_tag.outputs.EXISTS != 'true' &&
          env.CWS_CLIENT_ID != '' &&
          env.CWS_CLIENT_SECRET != '' &&
          env.CWS_REFRESH_TOKEN != ''
        uses: browser-actions/release-chrome-extension@bde2f9ad09b20a52d4e71eca4a9daf99d412a8d9 # v0.2.1
        with:
          extension-id: 'holdjgmcnpelgclhopiejilhhkfcmpba'
          extension-path: release/network-overrides-api-devtools-${{ env.TAG_NAME }}-store.zip
          oauth-client-id: ${{ env.CWS_CLIENT_ID }}
          oauth-client-secret: ${{ env.CWS_CLIENT_SECRET }}
          oauth-refresh-token: ${{ env.CWS_REFRESH_TOKEN }}
