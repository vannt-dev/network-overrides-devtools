<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Network Overrides</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h2>Network Overrides</h2>

    <label>
        <input id="enable" type="checkbox"> Enable Overrides
    </label>

    <div id="new-row">
        <input id="pattern" placeholder="URL contains (e.g. /api/data)" />
        <select id="mode">
            <option value="text">Text</option>
            <option value="file">Raw base64</option>
        </select>
        <textarea id="body" rows="6" placeholder="Response body"></textarea>
        <button id="add">Add override</button>
    </div>

    <h3>Overrides</h3>
    <ul id="list"></ul>

    <script src="popup.js"></script>
</body>

</html>
